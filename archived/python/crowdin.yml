preserve_hierarchy: true

files:
  - source: /locales/en-US/*.ftl
    dest: /bot/%file_name%.ftl
    translation: /locales/%locale%/%file_name%.ftl
    update_option: update_as_unapproved

    languages_mapping:
      locale:
        vi: vi
        tr: tr
        cs: cs
        el: el
        bg: bg
        ru: ru
        uk: uk
        hi: hi
        th: th
        zh-CN: zh-CN
        ja: ja
        zh-TW: zh-TW
        ko: ko
        id: id
        da: da
        de: de
        en-GB: en-GB
        es-ES: es-ES
        es-419: es-419
        fr: fr
        hr: hr
        it: it
        lt: lt
        hu: hu
        nl: nl
        no: no
        pl: pl
        pt-BR: pt-BR
        ro: ro
        fi: fi
        sv-SE: sv-SE

commit_message: "chore(l10n): new Crowdin translations"
